<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maaz Shamim - Google Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap">
<style>
:root{
  --blue:#1a73e8;--blue-h:#1557b0;
  --green:#0d652d;--url:#006621;
  --text:#202124;--gray:#4d5156;--light:#70757a;
  --bg:#fff;--bg2:#f8f9fa;--border:#dfe1e5;--border2:#e8eaed;
  --kbg:#fff;--shadow:rgba(32,33,36,.28);
  --tag-bg:#f1f3f4;--tag-bd:#dadce0;
  --exp-bg:#f8f9ff;--exp-bd:#d2e3fc;
  --chip-bg:#e8f0fe;--chip-c:#1967d2;
}
[data-theme="dark"]{
  --blue:#8ab4f8;--blue-h:#aecbfa;
  --green:#81c995;--url:#81c995;
  --text:#e8eaed;--gray:#bdc1c6;--light:#9aa0a6;
  --bg:#202124;--bg2:#303134;--border:#3c4043;--border2:#5f6368;
  --kbg:#303134;--shadow:rgba(0,0,0,.4);
  --tag-bg:#3c4043;--tag-bd:#5f6368;
  --exp-bg:#1e2d42;--exp-bd:#3c5a8a;
  --chip-bg:#1e3a5f;--chip-c:#8ab4f8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Google Sans','Roboto',arial,sans-serif;color:var(--text);background:var(--bg);transition:background .2s,color .2s}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.glogo{font-family:'Google Sans',arial,sans-serif;font-weight:400;letter-spacing:-1px;user-select:none;line-height:1}
.gl1{color:#4285F4}.gl2{color:#EA4335}.gl3{color:#FBBC05}.gl4{color:#4285F4}.gl5{color:#34A853}.gl6{color:#EA4335}

#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative}
#home .glogo{font-size:84px;margin-bottom:32px}
.search-wrap{width:100%;max-width:584px;position:relative}
.search-box{display:flex;align-items:center;border:1px solid var(--border);border-radius:24px;padding:0 16px;height:46px;background:var(--bg);box-shadow:0 1px 6px rgba(32,33,36,.18);transition:box-shadow .15s}
.search-box:hover,.search-box.focused{box-shadow:0 1px 8px var(--shadow);border-color:transparent}
.s-icon{width:20px;height:20px;fill:var(--light);flex:none}
.s-mic{width:20px;height:20px;fill:var(--blue);flex:none;margin-left:8px}
#typedQuery{flex:1;border:none;outline:none;font-size:16px;padding:0 12px;background:transparent;color:var(--text)}
.cursor{display:inline-block;width:1.5px;height:18px;background:var(--text);margin-left:1px;vertical-align:middle;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.home-btns{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.gbtn{background:var(--bg2);border:1px solid var(--bg2);border-radius:4px;color:var(--gray);font-size:14px;padding:0 16px;height:36px;transition:border-color .1s,box-shadow .1s}
.gbtn:hover{border-color:var(--tag-bd);box-shadow:0 1px 2px var(--shadow)}
.home-footer{position:absolute;bottom:0;left:0;right:0;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--light);background:var(--bg2);border-top:1px solid var(--border);flex-wrap:wrap;gap:8px}

.ac-box{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--border);border-top:none;border-radius:0 0 24px 24px;box-shadow:0 4px 6px var(--shadow);display:none;z-index:50;overflow:hidden;margin-top:-2px}
.ac-item{display:flex;align-items:center;gap:14px;padding:10px 16px;font-size:14px;color:var(--text);cursor:pointer}
.ac-item:hover{background:var(--tag-bg)}
.ac-icon{fill:var(--light);flex:none;width:16px;height:16px}
.ac-b{font-weight:500}

#results{display:none}
.topbar{border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
.topbar-inner{display:flex;align-items:center;gap:18px;padding:14px 24px 0;flex-wrap:wrap}
.topbar .glogo{font-size:28px;cursor:pointer;flex:none}
.tsw{flex:1;max-width:580px;min-width:180px;position:relative}
.tsb{display:flex;align-items:center;border:1px solid var(--border);border-radius:24px;padding:0 16px;height:44px;background:var(--bg);box-shadow:0 1px 4px rgba(32,33,36,.1);transition:box-shadow .15s}
.tsb:hover,.tsb.focused{box-shadow:0 1px 8px var(--shadow)}
.tsb input{flex:1;border:none;outline:none;font-size:16px;padding:0 10px;background:transparent;color:var(--text)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--light);font-size:18px;cursor:pointer;transition:background .1s}
.icon-btn:hover{background:var(--tag-bg)}
.av-btn{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.tabs-row{display:flex;overflow-x:auto;padding:0 100px 0 136px;scrollbar-width:none}
.tabs-row::-webkit-scrollbar{display:none}
.tab{padding:12px 12px 10px;font-size:13px;color:var(--light);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;user-select:none}
.tab:hover{color:var(--blue)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}

.body-wrap{display:flex;gap:40px;max-width:980px;margin:0 auto;padding:24px 24px 80px}
.main-col{flex:1;min-width:0;max-width:652px}
.stats{font-size:13px;color:var(--light);margin-bottom:20px}

.result{margin-bottom:26px;animation:fadeUp .2s ease both}
.demo{border:1px solid var(--exp-bd);background:var(--exp-bg);border-radius:12px;padding:18px 20px}
.demo-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--green);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.demo-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.demo-ttl{color:var(--text)!important}
.demo-txt{font-size:14px;color:var(--gray);line-height:1.65;margin-bottom:14px}
.demo-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:10px}
.demo-call{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:var(--bg);font-size:15px;font-weight:500;padding:10px 20px;border-radius:24px;text-decoration:none}
.demo-call:hover{background:var(--blue-h)}
.demo-link{font-size:14px;color:var(--blue);text-decoration:none}
.demo-link:hover{text-decoration:underline}
.demo-note{font-size:12px;color:var(--light);margin-bottom:12px}
.demo-chips{margin-bottom:0}
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;user-select:none;font-size:14px;font-weight:500;color:var(--light);text-transform:uppercase;letter-spacing:.6px;padding:6px 0;margin-bottom:14px;border-bottom:1px solid var(--border2)}
.grp-h::-webkit-details-marker{display:none}
.grp-h:hover{color:var(--text)}
.grp-n{font-size:12px;letter-spacing:0;background:var(--tag-bg);border-radius:10px;padding:1px 8px}
.grp-chev{margin-left:auto;transition:transform .15s}
.grp:not([open]) .grp-chev{transform:rotate(-90deg)}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.r-meta{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.r-fav{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;background:var(--tag-bg)}
.r-url{font-size:13px;color:var(--url);line-height:1.3}
.result h3{font-size:20px;font-weight:400;margin:0 0 5px;line-height:1.3}
.result h3 a{color:var(--blue);cursor:pointer}
.result h3 a:hover{text-decoration:underline}

.r-keyinfo{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.ki-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--chip-bg);color:var(--chip-c);border-radius:12px;padding:2px 9px;font-weight:500}

.r-snippet{font-size:14px;color:var(--gray);line-height:1.65}

.r-expand-toggle{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:13px;color:var(--blue);cursor:pointer;user-select:none}
.r-expand-toggle:hover{text-decoration:underline}
.r-chevron{font-size:11px;transition:transform .2s;display:inline-block}
.result.expanded .r-chevron{transform:rotate(180deg)}

.r-detail{display:none;margin-top:12px;padding:16px 18px;background:var(--exp-bg);border:1px solid var(--exp-bd);border-radius:8px;animation:fadeUp .15s ease}
.result.expanded .r-detail{display:block}
.r-bullets{list-style:none;padding:0;margin:0 0 10px}
.r-bullets li{font-size:14px;color:var(--gray);line-height:1.7;padding:4px 0 4px 18px;position:relative}
.r-bullets li::before{content:"·";position:absolute;left:4px;color:var(--blue);font-size:16px;line-height:1.5}
.r-bullets li b{color:var(--text);font-weight:500}
.r-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.rtag{font-size:12px;color:var(--gray);background:var(--tag-bg);border:1px solid var(--tag-bd);border-radius:12px;padding:2px 9px}

.sitelinks{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border2)}
.sitelink h4{font-size:14px;font-weight:400;margin:0 0 2px}
.sitelink h4 a{color:var(--blue)}
.sitelink h4 a:hover{text-decoration:underline}
.sitelink p{font-size:13px;color:var(--gray);margin:0}

.featured{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:16px;margin-bottom:24px}
.feat-label{font-size:11px;font-weight:500;color:var(--light);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.feat-text{font-size:14px;color:var(--text);line-height:1.7}

.paa{border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:20px 0}
.paa-title{font-size:18px;font-weight:400;padding:14px 0 4px}
.paa-item{border-top:1px solid var(--border)}
.paa-q{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;font-size:14px;cursor:pointer;color:var(--text)}
.paa-v{font-size:11px;color:var(--light);transition:transform .2s;flex:none;margin-left:12px}
.paa-item.open .paa-v{transform:rotate(180deg)}
.paa-a{max-height:0;overflow:hidden;font-size:13px;color:var(--gray);line-height:1.7;transition:max-height .25s ease,padding .25s;padding:0 4px}
.paa-item.open .paa-a{max-height:300px;padding:0 4px 12px}

.side-col{width:296px;flex:none}
.kpanel{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--kbg)}
.kp-hero{height:110px;background:linear-gradient(135deg,#667eea 0%,#764ba2 55%,#f093fb 100%);position:relative}
.kp-av{width:68px;height:68px;border-radius:50%;background:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#764ba2;position:absolute;bottom:-24px;left:16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.kp-body{padding:34px 16px 16px}
.kp-name{font-size:21px;font-weight:400;margin-bottom:2px}
.kp-role{font-size:13px;color:var(--gray);margin-bottom:3px}
.kp-avail{font-size:12px;color:#137333;font-weight:500;margin-bottom:12px}
.kpanel hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.kfact{display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;padding:4px 0;gap:8px}
.kfl{color:var(--light);flex:none;min-width:64px}
.kfv{color:var(--text);text-align:right;word-break:break-word}
.kfv a{color:var(--blue)}
.klinks{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.klink{font-size:13px;color:var(--blue);border:1px solid var(--border);border-radius:16px;padding:5px 11px;cursor:pointer;transition:background .1s}
.klink:hover{background:var(--tag-bg)}

.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.img-card{border-radius:8px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1.3;border:1px solid var(--border)}
.img-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;transition:transform .15s}
.img-card:hover .img-inner{transform:scale(1.07)}
.img-lbl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:12px;padding:8px 8px 6px}

.news-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-img{width:72px;height:72px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--tag-bg)}
.news-src{font-size:12px;color:var(--light);margin-bottom:4px}
.news-ttl{font-size:14px;font-weight:500;color:var(--blue);line-height:1.4;margin-bottom:4px;cursor:pointer}
.news-ttl:hover{text-decoration:underline}
.news-dt{font-size:12px;color:var(--light)}

#dtoggle{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:200;transition:background .2s}
#dtoggle:hover{background:var(--tag-bg)}

@media(max-width:760px){
  #home .glogo{font-size:60px}
  .topbar-inner{gap:10px;padding:10px 12px 0}
  .tabs-row{padding:0 12px}
  .body-wrap{flex-direction:column;padding:16px 12px 60px;gap:16px}
  .main-col{max-width:100%}
  .side-col{width:100%}
  .sitelinks{grid-template-columns:1fr}
  .img-grid{grid-template-columns:repeat(3,1fr)}
  .home-footer{font-size:12px}
}
@media(max-width:480px){
  #home .glogo{font-size:48px}
  .img-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

const P = {
  name:"Maaz Shamim", initials:"MS",
  tagline:"Backend & Distributed Systems Engineer · Graduate Researcher, JHU S4 Lab",
  location:"Baltimore, MD",
  email:"mshamim2@jh.edu", phone:"410-805-2285",
  linkedin:"linkedin.com/in/maaz-shamim",
  github:"github.com/Maaz5hamim",
  website:"maaz5hamim.github.io/Portfolio",

        "Transfers between shards run as <b>sagas</b> with compensating steps through per shard clearing accounts, so every step balances locally and the global sum of all entries stays exactly zero, even halfway through a transfer.",

let cardId=0;
function makeCard({fav,url,bc,title,chips,snippet,bullets,tags,sitelinks,href,delay}){
  const id='c'+(++cardId);
  const d=document.createElement('div');
  d.className='result'; d.id=id;
  d.style.animationDelay=(delay||0)*55+'ms';

  const chipsHtml=chips?chips.map(c=>`<span class="ki-chip">${c}</span>`).join(''):'';
  const tagsHtml=tags?`<div class="r-tags">${tags.map(t=>`<span class="rtag">${t}</span>`).join('')}</div>`:'';
  const bulletsHtml=bullets?`<ul class="r-bullets">${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`:'';
  const slHtml=sitelinks?`<div class="sitelinks">${sitelinks.map(sl=>`<div class="sitelink"><h4><a href="#" data-goto="${sl.goto}">${sl.title}</a></h4><p>${sl.desc}</p></div>`).join('')}</div>`:'';
  const showToggle=bullets||tags;

  d.innerHTML=`
    <div class="r-meta">
      <div class="r-fav">${fav||'🌐'}</div>
      <div class="r-url">${url||''}${bc?' › '+bc:''}</div>
    </div>
    <h3><a href="${href||'#'}" ${href&&href!='#'?'target="_blank" rel="noopener"':'onclick="toggleCard(\''+id+'\');return false"'}>${title}</a></h3>
    ${chipsHtml?`<div class="r-keyinfo">${chipsHtml}</div>`:''}
    <div class="r-snippet">${snippet}</div>
    ${slHtml}
    ${showToggle?`
    <div class="r-expand-toggle" onclick="toggleCard('${id}')">
      <span>More details</span><span class="r-chevron">▾</span>
    </div>
    <div class="r-detail">
      ${bulletsHtml}
      ${tagsHtml}
    </div>`:''}
  `;
  d.querySelectorAll('[data-goto]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.goto);}));
  return d;
}

function toggleCard(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.classList.toggle('expanded');
  const toggle=el.querySelector('.r-expand-toggle span:first-child');
  if(toggle) toggle.textContent=el.classList.contains('expanded')?'Less details':'More details';
}

function go(section,replace){
  document.title=section==='all'?`${P.name} - Google Search`:`${P.name} ${section} - Google Search`;
  $('#home').style.display='none';
  $('#results').style.display='block';
  const q=section==='all'?P.name:`${P.name} ${section}`;
  $('#qInput').value=q;
  renderTabs(section); renderPanel(section); renderList(section);
  const state={section};
  replace?history.replaceState(state,'','#'+section):history.pushState(state,'','#'+section);
  window.scrollTo(0,0);
}

function goHome(){
  history.pushState({home:true},'',location.pathname);
  $('#results').style.display='none';
  $('#home').style.display='flex';
  document.title='Google';
  $('#typeCursor').style.display='inline-block';
  runTyping();
}

let typTimer=null;
function runTyping(){
  const el=$('#typedQuery'); el.textContent=''; let i=0;
  if(typTimer)clearInterval(typTimer);
  typTimer=setInterval(()=>{
    el.textContent+=P.name.charAt(i); i++;
    if(i>=P.name.length){
      clearInterval(typTimer);
      setTimeout(()=>{$('#typeCursor').style.display='none';go('all',true);},700);
    }
  },95);
}

const dtog=$('#dtoggle');
function setTheme(dark){
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  dtog.textContent=dark?'☀️':'🌙';
  localStorage.setItem('theme',dark?'dark':'light');
}

$('#qInput').addEventListener('keydown',e=>{

const ac=$('#homeAC');

ac.addEventListener('mouseenter',()=>ac.style.display='block');
ac.addEventListener('mouseleave',()=>ac.style.display='none');

document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){
    e.preventDefault();
    if($('#results').style.display!=='none')$('#qInput').focus();
  }
});

window.addEventListener('popstate',e=>{
  if(e.state?.home||!e.state){$('#results').style.display='none';$('#home').style.display='flex';}
  else if(e.state?.section){$('#home').style.display='none';$('#results').style.display='block';renderTabs(e.state.section);renderPanel(e.state.section);renderList(e.state.section);}
});

runTyping();
